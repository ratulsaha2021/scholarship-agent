[project]
name = "scholarship-agent"
version = "0.1.0"
description = "AI agent that drafts and sends humanized PhD/scholarship application emails"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "groq>=0.9.0",
    "numpy>=1.24.0",
    "pdfplumber>=0.10.0",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.0.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "streamlit>=1.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
